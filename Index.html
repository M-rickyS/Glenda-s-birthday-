<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>💜 Happy Birthday Glenda Rachel 💜</title>
<style>
  /* ===== Global Styles ===== */
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(160deg, #0d0018, #2a003f);
    color: #fff;
    overflow-x: hidden;
    scroll-behavior: smooth;
  }

  h1,h2 {
    text-align: center;
    text-shadow: 0 0 15px #9b59b6, 0 0 30px #8e44ad;
  }

  h1 { font-size: 4rem; margin-top: 30px; }
  h2 { font-size: 2.2rem; margin: 40px 0 20px 0; }

  /* ===== Roadmap ===== */
  .roadmap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 50px 0;
    width: 90%;
    max-width: 1000px;
    margin-left: auto;
    margin-right: auto;
  }

  .month {
    background: rgba(255,255,255,0.05);
    padding: 25px;
    margin: 15px 0;
    border-radius: 20px;
    width: 80%;
    cursor: pointer;
    transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
    box-shadow: 0 0 10px #8e44ad;
  }

  .month:hover {
    transform: scale(1.05);
    background: rgba(255,255,255,0.15);
    box-shadow: 0 0 25px #9b59b6;
  }

  /* ===== Mini Games ===== */
  .mini-game {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 50px 0;
  }

  button {
    padding: 12px 25px;
    margin: 10px;
    background: #9b59b6;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
    font-size: 1rem;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 15px #8e44ad;
  }

  .quote-box {
    background: rgba(255,255,255,0.1);
    margin: 20px;
    padding: 20px;
    border-radius: 20px;
    width: 70%;
    text-align: center;
    font-style: italic;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .quote-box:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #9b59b6;
  }

  /* ===== Floating Hearts ===== */
  .heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #e84393;
    transform: rotate(-45deg);
    animation: float 6s infinite;
  }

  .heart::before, .heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: #e84393;
    border-radius: 50%;
  }
  .heart::before { top: -10px; left: 0; }
  .heart::after { top: 0; left: 10px; }

  @keyframes float {
    0% { transform: translateY(0) rotate(-45deg); opacity:1;}
    100% { transform: translateY(-800px) rotate(-45deg); opacity:0;}
  }

  /* ===== Falling Stars ===== */
  .star {
    position: absolute;
    width: 5px;
    height: 5px;
    background: #f7d86b;
    border-radius: 50%;
    animation: fall 3s linear infinite;
  }
  @keyframes fall {
    0% { top: -10px; }
    100% { top: 100vh; }
  }

  /* ===== Birthday Fireworks ===== */
  .firework {
    position: absolute;
    width: 5px;
    height: 5px;
    background: #fff;
    border-radius: 50%;
    animation: explode 1s ease-out forwards;
  }
  @keyframes explode {
    0% { transform: scale(1); opacity:1;}
    100% { transform: scale(10); opacity:0;}
  }

</style>
</head>
<body>

<h1>💜 Happy Birthday Glenda Rachel 💜</h1>
<h2>✨ Friendship Roadmap: January → October ✨</h2>

<div class="roadmap">
  <div class="month" onclick="alert('January: Met my hyper homegirl 😏 Black Clover talk started 🖤')">January</div>
  <div class="month" onclick="alert('February: Got closer, teasing started. Slave? Dog? Property? 😏💖')">February</div>
  <div class="month" onclick="alert('March: Legendary inside jokes 😂 Our laughs could wake the dead')">March</div>
  <div class="month" onclick="alert('April: Late night talks 🌙 Anime deep dives. You are my chaos 💜')">April</div>
  <div class="month" onclick="alert('May: Hanging out, teasing each other like pros 😎 You are my drug')">May</div>
  <div class="month" onclick="alert('June: Friendship growing 💛 But I lowkey want more 😏')">June</div>
  <div class="month" onclick="alert('July: Anime + meme chaos 🐶 You make my day brighter 💖')">July</div>
  <div class="month" onclick="alert('August: Teasing escalated 😏 You act like you own me 🖤')">August</div>
  <div class="month" onclick="alert('September: Besties forever, can’t lie I miss you 😘')">September</div>
  <div class="month" onclick="alert('October: You hyper, me crazy, perfect mix 💜 Almost unbearable but love it')">October</div>
</div>

<h2>🎮 Mini-Games Section 🎮</h2>
<div class="mini-game">
  <button onclick="startHearts()">Catch the Hearts 💌</button>
  <button onclick="showRandomQuote()">Get a Teasing / Romantic / Bible Line 💖</button>
  <button onclick="blackCloverQuiz()">Black Clover Quiz 🖤</button>
</div>

<div class="quote-box" id="quoteBox">
  "Our friendship is chaotic, hilarious, and unbreakable ✨"
</div>

<script>
  // ===== Floating Hearts Mini-game =====
  function startHearts() {
    for(let i=0;i<30;i++){
      let heart = document.createElement('div');
      heart.className='heart';
      heart.style.left=Math.random()*window.innerWidth+'px';
      heart.style.animationDuration=(Math.random()*3+3)+'s';
      document.body.appendChild(heart);
      setTimeout(()=>heart.remove(),6000);
    }
  }

  // ===== Quotes Section =====
  const quotes = [
    "You’re my hyper homegirl 😎",
    "Slave? Dog? Property? All jokes, but kinda true 😏",
    "Distance can’t touch this 💜",
    "You make my days brighter 😘",
    "Best inside-joke partner ever 😂",
    "Proverbs 17:17 - 'A friend loves at all times.'",
    "Ecclesiastes 4:9 - 'Two are better than one.'",
    "Romans 12:10 - 'Be devoted to one another in love.'",
    "John 15:13 - 'Greater love has no one than this…' ❤️",
    "I lowkey want more than friendship 😏",
    "Our teasing is hotter than any anime fight scene 😈",
    "You own me in ways only a queen can 😏💜",
    "Even when you bully me, I secretly love it 😘",
    "Our chaos = my favorite drug 💖"
  ];

  function showRandomQuote(){
    document.getElementById('quoteBox').innerText=quotes[Math.floor(Math.random()*quotes.length)];
  }

  // ===== Black Clover Quiz =====
  function blackCloverQuiz(){
    const q=prompt("Who is Asta's rival?\nA) Yuno\nB) Noelle\nC) Yami");
    if(q.toLowerCase()==='a'||q.toLowerCase()==='yuno') alert("Correct! 🖤");
    else alert("Oops! It's Yuno 😏");
  }

  // ===== Falling Stars =====
  setInterval(()=>{
    let star=document.createElement('div');
    star.className='star';
    star.style.left=Math.random()*window.innerWidth+'px';
    document.body.appendChild(star);
    setTimeout(()=>star.remove(),3000);
  },200);

  // ===== Birthday Fireworks =====
  setInterval(()=>{
    let fw=document.createElement('div');
    fw.className='firework';
    fw.style.left=Math.random()*window.innerWidth+'px';
    fw.style.top=Math.random()*200+'px';
    document.body.appendChild(fw);
    setTimeout(()=>fw.remove(),1000);
  },500);
</script>

</body>
</html>
